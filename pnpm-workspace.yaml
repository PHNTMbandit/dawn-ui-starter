packages:
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  lightningcss: true
minimumReleaseAgeExclude:
  - ixia-ui-react@1.0.0 || 1.0.1 || 1.0.2
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.5
  vite-plus: 1.2.0
  '@vitest/browser-playwright': 5.0.5
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
